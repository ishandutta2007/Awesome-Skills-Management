<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="80%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <radialGradient id="nodeGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nodeGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#c084fc" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="centerAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <style>
      @keyframes floatAnim {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes pulseAnim {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -100; }
      }
      @keyframes glowAnim {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.9; }
      }
      @keyframes rotateRing {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .floating { animation: floatAnim 6s ease-in-out infinite; }
      .pulsing1 { animation: pulseAnim 3.5s ease-in-out infinite; transform-origin: center; }
      .pulsing2 { animation: pulseAnim 4.2s ease-in-out infinite 0.8s; transform-origin: center; }
      .pulsing3 { animation: pulseAnim 3.8s ease-in-out infinite 1.6s; transform-origin: center; }
      .line-dash { stroke-dasharray: 6, 6; animation: dashAnim 15s linear infinite; }
      .glow-pulse { animation: glowAnim 4s ease-in-out infinite; }
      .rotating-ring { animation: rotateRing 25s linear infinite; transform-origin: 600px 210px; }
      
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 900;
        font-size: 52px;
        letter-spacing: -1.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />
  
  <!-- Subtle Background Grid -->
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Ambient Glowing Auras -->
  <circle cx="600" cy="210" r="340" fill="url(#centerAura)" class="glow-pulse" />
  <circle cx="150" cy="90" r="180" fill="url(#nodeGlow1)" opacity="0.4" />
  <circle cx="1050" cy="330" r="200" fill="url(#nodeGlow2)" opacity="0.4" />

  <!-- Dynamic Graph Network Background -->
  <g class="network-lines" opacity="0.6">
    <line x1="180" y1="120" x2="350" y2="80" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" class="line-dash" />
    <line x1="350" y1="80" x2="600" y2="110" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.5" />
    <line x1="600" y1="110" x2="850" y2="70" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.5" class="line-dash" />
    <line x1="850" y1="70" x2="1020" y2="130" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" />
    
    <line x1="140" y1="300" x2="320" y2="340" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.5" />
    <line x1="320" y1="340" x2="600" y2="310" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.5" class="line-dash" />
    <line x1="600" y1="310" x2="880" y2="340" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" />
    <line x1="880" y1="340" x2="1060" y2="290" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.5" class="line-dash" />

    <!-- Cross links -->
    <line x1="180" y1="120" x2="140" y2="300" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.35" />
    <line x1="1020" y1="130" x2="1060" y2="290" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.35" />
    <line x1="350" y1="80" x2="320" y2="340" stroke="#6366f1" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4,4" />
    <line x1="850" y1="70" x2="880" y2="340" stroke="#6366f1" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4,4" />
  </g>

  <!-- Animated Skill Nodes -->
  <!-- Node 1: Skills Intelligence -->
  <g transform="translate(180, 120)" class="floating">
    <circle cx="0" cy="0" r="28" fill="#38bdf8" opacity="0.15" class="pulsing1" />
    <circle cx="0" cy="0" r="14" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />
    <circle cx="0" cy="0" r="5" fill="#bae6fd" />
    <rect x="-65" y="22" width="130" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <text x="0" y="39" text-anchor="middle" fill="#7dd3fc" class="badge-text">⚡ Skills Intelligence</text>
  </g>

  <!-- Node 2: Competency Ontology -->
  <g transform="translate(1020, 130)" class="floating" style="animation-delay: -2s;">
    <circle cx="0" cy="0" r="28" fill="#c084fc" opacity="0.15" class="pulsing2" />
    <circle cx="0" cy="0" r="14" fill="#7e22ce" stroke="#c084fc" stroke-width="2" />
    <circle cx="0" cy="0" r="5" fill="#f3e8ff" />
    <rect x="-65" y="22" width="130" height="26" rx="13" fill="#0f172a" stroke="#c084fc" stroke-width="1" opacity="0.9" />
    <text x="0" y="39" text-anchor="middle" fill="#e9d5ff" class="badge-text">🧠 Skills Ontologies</text>
  </g>

  <!-- Node 3: Talent Mobility -->
  <g transform="translate(140, 300)" class="floating" style="animation-delay: -3s;">
    <circle cx="0" cy="0" r="26" fill="#818cf8" opacity="0.15" class="pulsing3" />
    <circle cx="0" cy="0" r="13" fill="#4338ca" stroke="#818cf8" stroke-width="2" />
    <circle cx="0" cy="0" r="4" fill="#e0e7ff" />
    <rect x="-60" y="-36" width="120" height="26" rx="13" fill="#0f172a" stroke="#818cf8" stroke-width="1" opacity="0.9" />
    <text x="0" y="-19" text-anchor="middle" fill="#c7d2fe" class="badge-text">🚀 Talent Mobility</text>
  </g>

  <!-- Node 4: AI Skill Inference -->
  <g transform="translate(1060, 290)" class="floating" style="animation-delay: -1s;">
    <circle cx="0" cy="0" r="26" fill="#34d399" opacity="0.15" class="pulsing1" />
    <circle cx="0" cy="0" r="13" fill="#047857" stroke="#34d399" stroke-width="2" />
    <circle cx="0" cy="0" r="4" fill="#d1fae5" />
    <rect x="-60" y="-36" width="120" height="26" rx="13" fill="#0f172a" stroke="#34d399" stroke-width="1" opacity="0.9" />
    <text x="0" y="-19" text-anchor="middle" fill="#a7f3d0" class="badge-text">✨ AI Inference</text>
  </g>

  <!-- Top Hub Nodes -->
  <circle cx="350" cy="80" r="6" fill="#38bdf8" />
  <circle cx="850" cy="70" r="6" fill="#c084fc" />
  <circle cx="320" cy="340" r="6" fill="#818cf8" />
  <circle cx="880" cy="340" r="6" fill="#38bdf8" />

  <!-- Center Core Title & Info Box -->
  <g transform="translate(600, 205)">
    <!-- Tech Tag / Chip -->
    <g transform="translate(0, -92)">
      <rect x="-145" y="-14" width="290" height="28" rx="14" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" opacity="0.95" />
      <circle cx="-120" cy="0" r="4" fill="#38bdf8" class="pulsing1" />
      <text x="5" y="5" text-anchor="middle" fill="#93c5fd" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1">CURATED ECOSYSTEM GUIDE</text>
      <circle cx="120" cy="0" r="4" fill="#c084fc" class="pulsing2" />
    </g>

    <!-- Main Title -->
    <text x="0" y="-20" text-anchor="middle" fill="url(#titleGrad)" class="title-text">
      Awesome Skills Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="24" text-anchor="middle" fill="#94a3b8" class="subtitle-text">
      Skills Intelligence • Competency Frameworks • Talent Marketplaces • AI Inference
    </text>

    <!-- Feature Pills / Highlights -->
    <g transform="translate(0, 72)">
      <!-- Pill 1 -->
      <g transform="translate(-240, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="0" y="4.5" text-anchor="middle" fill="#cbd5e1" class="badge-text">🏢 SaaS Leaders</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(-80, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="0" y="4.5" text-anchor="middle" fill="#cbd5e1" class="badge-text">💻 Open Source</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(80, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="0" y="4.5" text-anchor="middle" fill="#cbd5e1" class="badge-text">📊 Market Sizing</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(240, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="0" y="4.5" text-anchor="middle" fill="#cbd5e1" class="badge-text">📈 Star Rankings</text>
      </g>
    </g>
  </g>

  <!-- Sleek Glowing Bottom Border -->
  <rect x="0" y="415" width="1200" height="5" fill="url(#titleGrad)" rx="2" />
</svg>
